name: Iris Continuity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh machine-readable state and handoff checkpoint
        run: node scripts/iris-project-status.mjs --write
      - name: Commit continuity state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.json docs/MASTER_STATE.md docs/SESSION_HANDOFF.md
          if git diff --cached --quiet; then
            echo "Continuity state already current."
          else
            git commit -m "chore: refresh Iris continuity state [skip ci]"
            git push
          fi
